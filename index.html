<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple, responsive to-do list that saves tasks in your browser." />
    <title>Rakshak Tasks | To-do list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-app" aria-labelledby="page-title">
        <header class="app-header">
          <div>
            <p class="eyebrow">Rakshak workspace</p>
            <h1 id="page-title">My tasks</h1>
            <p class="subtitle">Keep your day organized, one task at a time.</p>
          </div>
          <div class="brand-mark" aria-hidden="true">R</div>
        </header>

        <form class="task-form" id="task-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input id="task-input" name="task" type="text" maxlength="160" placeholder="What needs to be done?" autocomplete="off" required />
          <button class="add-button" type="submit">Add task</button>
        </form>

        <div class="task-toolbar" aria-label="Task controls">
          <p class="task-count" id="task-count">0 tasks left</p>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>

        <ul class="task-list" id="task-list" aria-live="polite"></ul>
        <div class="empty-state" id="empty-state">
          <span class="empty-icon" aria-hidden="true">✓</span>
          <h2 id="empty-title">Nothing here yet</h2>
          <p id="empty-message">Add your first task above to get started.</p>
        </div>

        <p class="storage-note"><span aria-hidden="true">🔒</span> Your tasks are saved locally in this browser.</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
